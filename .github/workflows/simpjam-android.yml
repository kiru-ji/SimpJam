name: SimpJam Android CI

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    # Fork releases carry the simpjam- prefix: upstream's own tag history
    # (v0.1.5 … v2.3.0) was pushed with the fork, so bare v0.1.x collides.
    tags: [ 'v*', 'simpjam-v*' ]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'FORK_NOTICE.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure FOSS flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build debug APK
        run: ./gradlew androidApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simpjam-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  listen-together-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run listenTogether unit tests
        run: ./gradlew :listenTogether:jvmTest --tests "org.simpmusic.listentogether.ServerClockTest" --tests "org.simpmusic.listentogether.MessageCodecTest" --tests "org.simpmusic.listentogether.BlocklistTest"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listen-together-test-results
          path: core/service/listenTogether/build/reports/tests/

  # The wire protocol breaks ONLY in minified builds when R8 renames the
  # @Serializable payload fields — this shipped broken in Metrolist 13.4.x and
  # nobody noticed until users did. This job builds the real release APK with
  # R8 on and asserts the protocol classes survive minification intact.
  release-r8-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure FOSS flavor
        # FOSS build: no Sentry/Crashlytics, so no secrets and no mapping upload.
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build minified release APK (R8 on)
        run: ./gradlew androidApp:assembleRelease

      - name: R8 smoke — protocol classes must survive minification
        run: |
          set -euo pipefail
          APK=$(find androidApp/build/outputs/apk -name '*release*.apk' | head -1)
          echo "Checking $APK"
          mkdir -p /tmp/dex && unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex
          NEEDLES=(
            'Lorg/simpmusic/listentogether/JoinRequestPayload;'
            'Lorg/simpmusic/listentogether/PlaybackActionPayload;'
            'Lorg/simpmusic/listentogether/TrackInfo;'
            'Lorg/simpmusic/listentogether/MessageCodec;'
            # v0.1.1 shipped a minified build where navigation's runtime serializer
            # lookup threw "Serializer for class '…' is not found" on opening Listen
            # Together: R8 had stripped the generated $serializer for a typed route.
            # NB: a @Serializable data CLASS emits Class$$serializer (double $); a
            # data OBJECT does NOT — the object itself is the serializer, so only its
            # class name is checkable. Keep rules name-pin both; needles match reality.
            'Lcom/maxrave/simpmusic/ui/navigation/destination/home/ListenTogetherDestination;'
            'Lcom/maxrave/simpmusic/ui/navigation/destination/home/ListenTogetherDestination$$serializer;'
            'Lcom/maxrave/simpmusic/ui/navigation/destination/home/ListenTogetherSettingsDestination;'
          )
          FAIL=0
          for n in "${NEEDLES[@]}"; do
            if grep -rqF "$n" /tmp/dex/; then
              echo "  ✓ $n present"
            else
              echo "  ✗ $n MISSING — R8 renamed/stripped the wire protocol!"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || { echo "R8 smoke FAILED: see androidApp/proguard-rules.pro keep rules"; exit 1; }
          echo "R8 smoke passed: listen-together protocol intact in minified build"

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: simpjam-release-unsigned-apk
          path: androidApp/build/outputs/apk/**/*.apk

      - name: Upload R8 mapping (de-obfuscate future crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: simpjam-r8-mapping
          path: androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

  # The installable artifact: a signed, zipaligned release APK. The keystore
  # lives only in GitHub's vault (SIMPJAM_KEYSTORE_B64) and on the operator's
  # VPS; nothing sensitive is ever committed.
  release-signed:
    runs-on: ubuntu-latest
    needs: release-r8-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure FOSS flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build release APK
        run: ./gradlew androidApp:assembleRelease

      - name: Restore keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.SIMPJAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          # tr strips any stray newlines; -w0 output is single-line but be paranoid.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > simpjam.jks
          test $(stat -c%s simpjam.jks) -gt 1000 || { echo "keystore looks truncated"; exit 1; }
          ls -la simpjam.jks

      - name: Sign + verify release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIMPJAM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIMPJAM_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          for apk in $(find androidApp/build/outputs/apk -name '*release*.apk'); do
            name=$(basename "$apk" .apk)
            name=${name/-unsigned/}   # "…release-unsigned" + "-signed" reads silly
            "$BT/zipalign" -f -p 4 "$apk" "dist/${name}-aligned.apk"
            # apksigner wants a PASSWORD SPEC, not a bare password: env:NAME makes it read
            # KEYSTORE_PASSWORD from the environment without ever putting it on a command line.
            "$BT/apksigner" sign \
              --ks simpjam.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEYSTORE_PASSWORD \
              --out "dist/${name}-signed.apk" "dist/${name}-aligned.apk"
            "$BT/apksigner" verify --verbose "dist/${name}-signed.apk" | head -4
            rm -f "dist/${name}-aligned.apk"
          done
          ls -la dist/

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: simpjam-release-signed
          path: dist/*.apk

      - name: Publish to GitHub Releases (on version tags)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/simpjam-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/*.apk \
            --repo kiru-ji/SimpJam \
            --title "SimpJam ${TAG}" \
            --notes "Signed release build. See ROADMAP.md for what changed since upstream." \
            || gh release upload "$TAG" dist/*.apk --repo kiru-ji/SimpJam
