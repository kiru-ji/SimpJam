name: SimpJam Android CI

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'FORK_NOTICE.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure FOSS flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build debug APK
        run: ./gradlew androidApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simpjam-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  listen-together-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run listenTogether unit tests
        run: ./gradlew :listenTogether:jvmTest --tests "org.simpmusic.listentogether.ServerClockTest" --tests "org.simpmusic.listentogether.MessageCodecTest" --tests "org.simpmusic.listentogether.BlocklistTest"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listen-together-test-results
          path: core/service/listenTogether/build/reports/tests/

  # The wire protocol breaks ONLY in minified builds when R8 renames the
  # @Serializable payload fields — this shipped broken in Metrolist 13.4.x and
  # nobody noticed until users did. This job builds the real release APK with
  # R8 on and asserts the protocol classes survive minification intact.
  release-r8-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure FOSS flavor
        # FOSS build: no Sentry/Crashlytics, so no secrets and no mapping upload.
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build minified release APK (R8 on)
        run: ./gradlew androidApp:assembleRelease

      - name: R8 smoke — protocol classes must survive minification
        run: |
          set -euo pipefail
          APK=$(find androidApp/build/outputs/apk -name '*release*.apk' | head -1)
          echo "Checking $APK"
          mkdir -p /tmp/dex && unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex
          NEEDLES=(
            'Lorg/simpmusic/listentogether/JoinRequestPayload;'
            'Lorg/simpmusic/listentogether/PlaybackActionPayload;'
            'Lorg/simpmusic/listentogether/TrackInfo;'
            'Lorg/simpmusic/listentogether/MessageCodec;'
          )
          FAIL=0
          for n in "${NEEDLES[@]}"; do
            if grep -rqF "$n" /tmp/dex/; then
              echo "  ✓ $n present"
            else
              echo "  ✗ $n MISSING — R8 renamed/stripped the wire protocol!"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || { echo "R8 smoke FAILED: see androidApp/proguard-rules.pro keep rules"; exit 1; }
          echo "R8 smoke passed: listen-together protocol intact in minified build"

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: simpjam-release-unsigned-apk
          path: androidApp/build/outputs/apk/**/*.apk
